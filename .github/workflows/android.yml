name: Build For Android

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag"
                required: false
                default: ""
                type: string

jobs:
    android:
        name: Release Android
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: 代码迁出
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Bottom Sheet Patch
              working-directory: ${{ env.FLUTTER_ROOT }}
              run: git apply $GITHUB_WORKSPACE/lib/scripts/bottom_sheet_patch.diff
              continue-on-error: true

            - name: Write Key
              run: |
                  if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
                    echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > android/app/key.jks
                    echo "storeFile=key.jks" >> android/key.properties
                    echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> android/key.properties
                    echo "keyAlias=${{ secrets.ALIAS }}" >> android/key.properties
                    echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
                  fi

            - name: Set And Extract Version
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Flutter Build Apk
              run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --pub

            - name: Rename
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliPlus_android_${{ env.version }}_${abi}.apk"
                  done
              shell: bash

            - name: 上传
              uses: actions/upload-artifact@v5
              with:
                  name: Android_arm64-v8a
                  path: |
                      PiliPlus_android_*_arm64-v8a.apk

            - name: 上传
              uses: actions/upload-artifact@v5
              with:
                  name: Android_armeabi-v7a
                  path: |
                      PiliPlus_android_*_armeabi-v7a.apk

            - name: 上传
              uses: actions/upload-artifact@v5
              with:
                  name: Android_x86_64
                  path: |
                      PiliPlus_android_*_x86_64.apk
