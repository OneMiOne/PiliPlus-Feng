name: Build For Windows
on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag"
                required: false
                default: ""
                type: string
jobs:
    windows:
        name: Release Windows
        runs-on: windows-latest
        permissions: write-all
        steps:
            - name: 代码迁出
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true
            - name: Apply Bottom Sheet Patch
              working-directory: ${{ env.FLUTTER_ROOT }}
              # Windows 环境下 Git Apply 依然有效
              run: git apply ${{ github.workspace }}/lib/scripts/bottom_sheet_patch.diff
              continue-on-error: true
            - name: Set And Extract Version
              shell: pwsh
              run: lib/scripts/build.ps1 windows
            - name: Flutter Build Windows
              run: flutter build windows --release --dart-define-from-file=pili_release.json --pub
            - name: Windows
              shell: pwsh
              run: |
                  # 创建一个文件夹用来存放生成的 EXE 和 DLL
                  $exportFolder = "PiliPlus_windows_${env:version}"
                  New-Item -ItemType Directory -Path $exportFolder
                  
                  # 复制构建产物到文件夹
                  if (Test-Path "build\windows\x64\runner\Release") {
                      Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination $exportFolder -Recurse
                  } elseif (Test-Path "build\windows\runner\Release") {
                      Copy-Item -Path "build\windows\runner\Release\*" -Destination $exportFolder -Recurse
                  }
                  
                  # 压缩为 ZIP 方便下载
                  Compress-Archive -Path "$exportFolder\*" -DestinationPath "$exportFolder.zip"
            - name: 上传
              uses: actions/upload-artifact@v5
              with:
                  name: Windows_Build
                  path: PiliPlus_windows_*.zip
